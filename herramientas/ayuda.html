<style>

#ayuda .ay-cerrar{border:1px solid #cbd5e1;background:#fff;color:#0f172a}
#ayuda .ay-ok{border:0;background:#16a34a;color:#fff}
</style>

 rutas:{titulo:"Tablero de Rutas",para:"Logística y Despacho",tab:"rutas",video:V(5,"05-rutas"),pasos:[

 alisto:{titulo:"Alisto",para:"Jefe de Alisto",tab:"alisto",video:V(3,"03-alisto"),pasos:[

 recibir:{titulo:"Recibir pedidos",para:"Alistadores",tab:"recibir",video:V(4,"04-recibir"),pasos:[
  ["Escriba o escanee el número de proforma. El cliente y la ruta se llenan solos.",7.9],

 facturar:{titulo:"Facturación",para:"Facturación",tab:"facturar",video:V(6,"06-facturacion"),pasos:[

 chofer:{titulo:"Mi ruta",para:"Choferes y ruteros",tab:"carga",video:V(7,"07-choferes"),pasos:[

 hoy:{titulo:"Hoy",para:"Gerencia",tab:"hoy",video:V(8,"08-gerencia"),pasos:[

 reportes:{titulo:"Reportes",para:"Gerencia",tab:"reportes",video:V(8,"08-gerencia"),desde:14.6,pasos:[

 bitacora:{titulo:"Bitácora de movimientos",para:"Administración",tab:"bitacora",video:V(8,"08-gerencia"),desde:19.7,pasos:[

};
GUIAS.estacion={...GUIAS.recibir,tab:"estacion"};
const esAdm=()=>yo("ajustes");
function guiaDe(t){
  if(t==="contab")t="aprobar";
  if(t==="aprobar"){
    if(esAdm())return apVista==="ruta"?"ventas":"conta";
    if(typeof verConta==="function"&&verConta())return "conta";
    if(yo("aprobarV")||yo("ventasB"))return "ventas";
    return "rutaLog";
  }
  if(t==="estacion")return "recibir";
  if(t==="carga")return "chofer";
  return GUIAS[t]?t:null;
}
// Guías que también le sirven a esta persona (según lo que puede abrir)
function misGuias(){
  if(!sesion)return [];
  const l=[];const add=g=>{if(g&&!l.includes(g))l.push(g)};
  if(esAdm()){Object.keys(GUIAS).filter(g=>g!=="estacion").forEach(add);return l}
  ["recibir","alisto","inventario","aprobar","rutas","carga","facturar","hoy","gps","reportes","bitacora","ajustes"].forEach(t=>{if(permitido(t))add(guiaDe(t))});
  if(permitido("aprobar")){if(verConta())add("conta");if(yo("aprobarV")||yo("ventasB"))add("ventas");if(yo("mover")||yo("cerrar"))add("rutaLog")}
  return l;
}
const clave=g=>"despacho.ayuda.ok."+(sesion&&sesion.id||"x")+"."+g;
const visto=g=>{try{return localStorage.getItem(clave(g))==="1"}catch(e){return true}};
let actual=null;
function abrir(g){
  const G=GUIAS[g];if(!G)return;actual=g;
  const otras=misGuias().filter(x=>x!==g&&x!=="estacion");
  const nota=typeof G.nota==="function"?G.nota():G.nota;
  const el=document.getElementById("ayuda");
  el.innerHTML=`<div class="ay-box">
   <div class="ay-hd"><div class="ay-k">¿Cómo se usa? ${G.video?"· video "+G.video.n+" de 8":""}</div><h2 id="ay-tit">${G.titulo}</h2><div class="ay-para">Para: ${G.para}${sesion?` · ${esc(sesion.nombre)}`:""}</div></div>
   <div class="ay-cuerpo">
    <div>${G.video?`<video id="ay-vid" controls playsinline preload="none" poster="${G.video.poster}" src="${G.video.src}"></video>`:`<div class="ay-sinvideo">Esta pantalla todavía no tiene video. Siga los pasos de la derecha.</div>`}</div>
    <ol>${G.pasos.map(p=>`<li><div>${p[0]}${G.video&&p[1]!=null?` <button type="button" class="ay-ver" data-ayt="${p[1]}">▶ ver</button>`:""}</div></li>`).join("")}</ol>
   </div>
   ${nota?`<div class="ay-nota">${nota}</div>`:""}
   ${otras.length?`<div class="ay-otras">${esAdm()?"Guías de los otros puestos:":"Usted también usa:"}<br>${otras.map(x=>`<button type="button" data-ayg="${x}">${GUIAS[x].titulo}</button>`).join("")}</div>`:""}
   <div class="ay-pie"><div class="note">${visto(g)?"Esta guía ya la marcó como entendida. Puede verla cuando quiera con el botón «?».":"Esta guía se abre sola cada vez que entra, hasta que toque «Ya entendí»."}</div>
    <button type="button" class="ay-cerrar" data-aycerrar>Cerrar</button><button type="button" class="ay-ok" data-ayok>Ya entendí ✓</button></div></div>`;
  el.hidden=false;
  const v=document.getElementById("ay-vid");if(v&&G.desde){v.addEventListener("loadedmetadata",()=>{if(v.currentTime<1)v.currentTime=G.desde},{once:true})}
}
function cerrar(){const el=document.getElementById("ayuda");const v=document.getElementById("ay-vid");if(v)try{v.pause()}catch(e){}el.hidden=true;el.innerHTML="";actual=null}
document.addEventListener("click",e=>{
  let b;
  if((b=e.target.closest("[data-ayuda-abrir]"))){const g=guiaDe(tab);if(g)abrir(g);return}
  if(!e.target.closest("#ayuda"))return;
  if(e.target.id==="ayuda"||e.target.closest("[data-aycerrar]")){cerrar();return}
  if(e.target.closest("[data-ayok]")){try{localStorage.setItem(clave(actual),"1")}catch(er){}cerrar();if(typeof toast==="function")toast("Listo. Si la necesita otra vez, toque el botón «?».");return}
  if((b=e.target.closest("[data-ayg]"))){abrir(b.dataset.ayg);return}
  if((b=e.target.closest("[data-ayt]"))){const v=document.getElementById("ay-vid");if(v){const t=+b.dataset.ayt;const ir=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)ir();else{v.addEventListener("loadedmetadata",ir,{once:true});v.load()}}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("ayuda").hidden)cerrar()});
// Botón grande arriba de cada pantalla
const fila=document.createElement("div");fila.className="ayuda-fila";fila.hidden=true;
fila.innerHTML=`<button type="button" class="ayuda-tab" data-ayuda-abrir><span class="ic">?</span><span id="ayuda-txt">¿Cómo se usa?</span></button>`;
const main=document.querySelector("main.wrap");if(main)main.insertBefore(fila,main.firstChild);
// Ícono «?» en la barra de arriba
const q=document.createElement("button");q.type="button";q.className="ayuda-q";q.setAttribute("data-ayuda-abrir","");q.title="¿Cómo se usa?";q.setAttribute("aria-label","¿Cómo se usa?");q.textContent="?";q.hidden=true;
const ss=document.getElementById("sess");if(ss&&ss.parentNode)ss.parentNode.insertBefore(q,ss.nextSibling);
function pintar(){
  const g=sesion?guiaDe(tab):null;fila.hidden=!g;q.hidden=!g;
  const t=document.getElementById("ayuda-txt");if(t&&g)t.textContent="¿Cómo se usa? · "+GUIAS[g].titulo;
}
let espera=null;
function auto(){
  clearTimeout(espera);let n=0;
  const intenta=()=>{
    if(!sesion)return;const g=guiaDe(tab);if(!g||visto(g)||actual)return;
    const sh=document.getElementById("sheet");const ocupado=(sh&&!sh.hidden&&sh.innerHTML.trim())||(()=>{const en=document.getElementById("entrada");return en&&!en.hidden&&en.offsetParent!==null})();
    if(ocupado){if(++n<40)espera=setTimeout(intenta,1500);return}
    abrir(g);
  };
  espera=setTimeout(intenta,700);
}
const _setTab=setTab;
setTab=function(t){const r=_setTab.apply(this,arguments);pintar();auto();return r};
const _rs=renderSesion;
renderSesion=function(){const r=_rs.apply(this,arguments);pintar();if(sesion)auto();return r};
document.addEventListener("click",e=>{if(e.target.closest("#ap-vista [data-av]"))setTimeout(pintar,50)});
window.AYUDA={abrir,guiaDe,GUIAS};
setTimeout(()=>{pintar();auto()},1200);
})();
</script>
